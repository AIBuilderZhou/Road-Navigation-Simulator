<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>路网模板编辑器 · IPQ-RoadNavigation</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171d24; --panel2:#1e252e; --line:#2b3641;
    --fg:#e6edf3; --muted:#8b98a5; --accent:#58a6ff; --warn:#f0883e;
    --ok:#3fb950; --bad:#f85149;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:8px 12px;background:var(--panel);
         border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:700;white-space:nowrap}
  .tabs{display:flex;gap:3px;background:var(--panel2);border:1px solid var(--line);
        border-radius:8px;padding:3px}
  .tab{background:transparent;border:none;color:var(--muted);padding:6px 12px;border-radius:6px;
       cursor:pointer;font-size:12px}
  .tab:hover{color:var(--fg)}
  .tab.active{background:#1f6feb;color:#fff}
  .spacer{flex:1}
  .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{flex:1;display:flex;min-height:0}
  #mainArea{flex:1;position:relative;min-width:0;overflow:hidden}
  .pane{position:absolute;inset:0;display:none}
  .pane.active{display:block}
  #mapWrap{background:radial-gradient(circle at 50% 40%,#141b23,#0d1218)}
  #map{width:100%;height:100%;display:block}
  #toolbar{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;
           background:#000000aa;border:1px solid var(--line);border-radius:8px;padding:6px;z-index:4}
  #toolbar button{font-size:12px}
  #toolbar button.active{border-color:var(--accent);color:var(--accent)}
  #mapHint{position:absolute;left:12px;bottom:12px;max-width:560px;background:#000000aa;
           border:1px solid var(--line);border-radius:6px;padding:6px 9px;color:var(--muted);
           font-size:12px;line-height:1.55;pointer-events:none;z-index:3}
  #chartWrap{padding:10px 14px 4px;background:radial-gradient(circle at 50% 40%,#141b23,#0d1218)}
  #chart{width:100%;height:100%;display:block}
  #chartHint{position:absolute;left:20px;bottom:12px;color:var(--muted);font-size:12px;
             background:#000000aa;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
  #jsonWrap{overflow:auto;padding:14px}
  #jsonPreview{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;
               padding:12px;font:12px/1.55 "SFMono-Regular",Consolas,"Liberation Mono",monospace;
               white-space:pre;color:#c9d6e2;min-height:100%}
  #side{width:470px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px}
  #side h2{font-size:14px;margin:0 0 8px}
  #side h3{font-size:12px;color:var(--muted);margin:16px 0 6px;font-weight:600;
           text-transform:uppercase;letter-spacing:.04em}
  #side h4{font-size:12px;margin:10px 0 4px;color:var(--fg)}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;
         padding:5px 10px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--accent)}
  button.primary{background:#1f6feb;border-color:#1f6feb}
  button.danger{color:#ffb4ae;border-color:#f8514966}
  button:disabled{opacity:.4;cursor:not-allowed}
  input[type=text],input[type=number],select{background:var(--panel2);color:var(--fg);
        border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12px;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input.invalid{border-color:var(--bad)}
  label.field{display:block;margin:8px 0}
  label.field .head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;
                    color:var(--fg);font-size:12px;margin-bottom:3px}
  label.field .unit{color:var(--muted);font-size:11px;font-weight:400}
  label.field .help{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.45}
  .badge{display:inline-block;border:1px solid #f0883e66;color:var(--warn);border-radius:8px;
         padding:0 5px;font-size:10px;margin-left:5px;vertical-align:1px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .note{color:var(--muted);font-size:12px;background:var(--panel2);border:1px solid var(--line);
        border-radius:6px;padding:8px 10px;margin:8px 0;line-height:1.55}
  .errors{font-size:12px;line-height:1.55;margin:6px 0}
  .errors .bad{color:#ffb4ae}
  .errors .warn{color:#f8c47a}
  .errors .ok{color:#7ee787}
  #exportStats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
  #exportStats .stat{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
                     padding:7px 8px;min-width:0}
  #exportStats .stat.wide{grid-column:1/-1}
  #exportStats .k{display:block;color:var(--muted);font-size:10px;line-height:1.35}
  #exportStats .v{display:block;color:var(--fg);font-size:14px;font-weight:600;line-height:1.35;
                  overflow-wrap:anywhere}
  #exportStats .stat.wide .v{font-size:18px}
  #exportStats .v.big{font-size:22px}
  #exportStats .sub{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:2px}
  .readonly{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
            padding:5px 7px;color:var(--muted);font-size:12px;display:block}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  .scroll{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px}
  details.legacyBox{margin:18px 0 4px;border:1px solid var(--line);border-radius:8px;
                    background:var(--panel2);padding:0 10px}
  details.legacyBox summary{cursor:pointer;color:var(--muted);font-size:12px;
                            padding:8px 0;list-style:none}
  details.legacyBox summary::-webkit-details-marker{display:none}
  details.legacyBox summary:before{content:'▸ ';color:var(--accent)}
  details.legacyBox[open] summary:before{content:'▾ '}
  details.legacyBox[open] summary{color:var(--fg);border-bottom:1px solid var(--line);
                                  margin-bottom:4px}
  details.legacyBox h4{margin-top:12px}
  .trash{cursor:pointer;color:#ffb4ae;background:none;border:none;padding:0 2px;font-size:13px}
  footer{display:flex;align-items:center;gap:16px;padding:7px 12px;background:var(--panel);
         border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex-wrap:wrap}
  footer .right{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap}
  #toast{position:fixed;right:16px;bottom:48px;background:#000000dd;border:1px solid var(--line);
         border-radius:8px;padding:8px 12px;font-size:12px;opacity:0;pointer-events:none;
         transition:opacity .15s;z-index:80;max-width:420px}
  #toast.on{opacity:1}
  .emptyHint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
             color:var(--muted);font-size:13px;text-align:center;line-height:1.8;pointer-events:none}
  svg text{user-select:none}
  .nodeLabel{pointer-events:none}
  .chartLabel{fill:var(--muted);font-size:13px}
  .axisLine{stroke:#2b3641;stroke-width:1}
  .gridLine{stroke:#202a34;stroke-width:1}
</style>
</head>
<body>

<header>
  <span class="brand">路网模板编辑器</span>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="params">参数设置</button>
    <button class="tab" data-tab="roads">道路设置</button>
    <button class="tab" data-tab="cars">车辆设置</button>
    <button class="tab" data-tab="export">导出</button>
  </nav>
  <span class="spacer"></span>
  <button id="btnImport" title="导入 template/report 的节点、道路和参数；忽略报告里的车辆">导入 template</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <span class="meta" id="topMeta">节点 0 · 道路 0</span>
</header>

<main>
  <section id="mainArea">
    <div id="mapWrap" class="pane active">
      <svg id="map" viewBox="0 0 100 75" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="toolbar">
        <button data-tool="select" class="active">选择/移动</button>
        <button data-tool="add">添加节点</button>
        <button data-tool="connect">连线</button>
        <button id="btnDeleteSel" class="danger" disabled>删除选中</button>
      </div>
      <div id="mapHint">在“道路设置”中选择「添加节点」，然后点击地图放置节点。</div>
    </div>

    <div id="chartWrap" class="pane">
      <svg id="chart" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="chartHint">点击空白处新增控制点；拖动控制点；右键或 Delete 删除选中点。曲线值支持 0.1 步长（&lt;1 为概率），触发间隔在右侧设置。</div>
    </div>

    <div id="jsonWrap" class="pane">
      <pre id="jsonPreview">// 导出预览</pre>
    </div>
  </section>

  <aside id="side"></aside>
</main>

<footer>
  <span id="statusLeft">参数设置：编辑运行、车辆、仿真参数。</span>
  <span class="right">
    <span id="statusRight"></span>
  </span>
</footer>

<div id="toast"></div>

<script>
"use strict";

/* ================================================================== *
 *  Constants and small helpers
 * ================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const MAP_W = 100;
const MAP_H = 75;
const CHART = {w: 1000, h: 640, left: 70, right: 28, top: 28, bottom: 54};
const MAX_CARS = 1000000;
const WARN_CARS = 200000;
const PREVIEW_CARS_LIMIT = 50000;
const MAX_FRAMES = 500000;

const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const fmt = (v, d) => (v === null || v === undefined || Number.isNaN(v))
  ? '—' : Number(v).toFixed(d === undefined ? 3 : d);
const intOrNaN = v => {
  if (v === '' || v === null || v === undefined) return NaN;
  const n = Number(v);
  return Number.isInteger(n) ? n : NaN;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[c]));

function nextUid(){
  S.uid += 1;
  return S.uid;
}

function stamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-` +
         `${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

/* ================================================================== *
 *  State
 * ================================================================== */
const S = {
  tab: 'params',
  params: null,
  nodes: [],
  roads: [],
  selected: null,          // {type:'node'|'road', id:number}
  tool: 'select',
  drag: null,              // {node, offX, offY}
  connect: null,           // {from, line}
  curveDrag: null,         // {uid}
  curve: [],
  curveSelected: null,     // uid
  carMode: 'curve',        // 'curve' | 'random'
  manualCars: [],          // {uid,start,goal,frame}
  exportName: '',
  sessionSeed: (Math.random() * 0xffffffff) >>> 0,
  suppressClickUntil: 0,
  toastTimer: null,
  uid: 0
};

function defaultParams(){
  return {
    road: {
      num_nodes: 0,
      max_lanes: 3,
      max_degree: 4,
      edge_prob: 0.2,
      force_single_road: [],
      connection_limit: 10,
      ring: false,
      exp_road_length: 10,
      var_road_length: 0.2,
      angle_variation: 0.1
    },
    cars: {
      num_cars_initially: 200,
      new_car_prob: 1 / 60,
      new_car_range: [1, 3],
      spawn_interval: 1
    },
    simulator: {
      standard_speed: 80,
      car_length: 0.005,
      minimum_distance: 0.002,
      reaction_time: 1.5 / 3600,
      minimum_speed: 5,
      meters_per_unit: 10,
      jam_density: 130,
      lane_speed_step: 10,
      idm_accel: 1.5,
      idm_decel: 2.0,
      idm_time_gap: 1.2,
      idm_min_gap: 2.0,
      idm_delta: 4.0,
      log_every: 12
    },
    run: {
      FPS: 43200,
      FRAMES: 86400,
      PIC_SCALE: 2,
      SHOW_MID_PROCESS: false,
      FRAMES_PER_OUTPUT: 30,
      GENERATE_GIF: false,
      GIF_FPS: 24,
      GIF_ENGINE: 'auto',
      GIF_TIMESTEP_SKIP: 24,
      SEED: null
    }
  };
}

/* ================================================================== *
 *  Basic state helpers
 * ================================================================== */
function nodeById(id){
  return S.nodes.find(n => n.id === id) || null;
}

function roadById(id){
  return S.roads.find(r => r.id === id) || null;
}

function nodeDegree(id){
  return S.roads.reduce((n, r) => n + (r.a === id || r.b === id ? 1 : 0), 0);
}

function roadLength(road){
  const a = nodeById(road.a);
  const b = nodeById(road.b);
  if (!a || !b) return 0;
  return Math.hypot(b.x - a.x, b.y - a.y);
}

function connectedRoadsOfNode(id){
  return S.roads.filter(r => r.a === id || r.b === id);
}

function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++){
    const key = parts[i];
    if (cur[key] === undefined || cur[key] === null) cur[key] = {};
    cur = cur[key];
  }
  cur[parts[parts.length - 1]] = value;
}

function getPath(obj, path){
  return path.split('.').reduce((cur, key) => cur == null ? undefined : cur[key], obj);
}

function updateChrome(){
  $('topMeta').textContent =
    `节点 ${S.nodes.length} · 道路 ${S.roads.length} · 手工车 ${S.manualCars.length}`;

  const hints = {
    params: '参数设置：编辑运行、车辆、仿真参数；导出时使用这里的值。',
    roads: '道路设置：点击空白添加节点，拖动节点移动，选择「连线」后从一个节点拖到另一个节点建边。',
    cars: '车辆设置：折线图按触发间隔控制生成车辆数/概率；初始车辆单独设置；也可切换回旧随机逻辑。',
    export: '导出：校验通过后下载 template-时间戳.json；main.py 用 REPLAY_REPORT 读取。'
  };
  $('statusLeft').textContent = hints[S.tab] || '';
  const curvePts = S.curve.length;
  $('statusRight').textContent =
    `模式：${S.carMode === 'curve' ? '曲线' : '旧随机'} · 曲线控制点 ${curvePts} · 节点 ${S.nodes.length} · 道路 ${S.roads.length}`;

  const del = $('btnDeleteSel');
  if (del) del.disabled = !S.selected;
}

/* ================================================================== *
 *  Seeded random (mulberry32); used to materialise the spawn plan
 * ================================================================== */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function planRng(){
  const seed = S.params.run.SEED;
  if (seed !== null && Number.isInteger(seed) && seed >= 0){
    return mulberry32(seed >>> 0);
  }
  return mulberry32(S.sessionSeed >>> 0);
}

function randInt(rand, lo, hi){
  return lo + Math.floor(rand() * (hi - lo + 1));
}

function randomPair(rand, n){
  const a = Math.floor(rand() * n);
  let b = Math.floor(rand() * (n - 1));
  if (b >= a) b += 1;
  return [a, b];
}

/* ================================================================== *
 *  Validation
 * ================================================================== */
function validateParams(){
  const e = [];
  const p = S.params;
  const req = (v, name, min, max, integer) => {
    if (!Number.isFinite(v) || (integer && !Number.isInteger(v)) ||
        v < min || (max !== undefined && v > max)){
      e.push(`${name} 取值不合法（当前 ${v}）`);
    }
  };

  req(p.run.FPS, 'FPS', 0.001);
  req(p.run.FRAMES, 'FRAMES', 1, MAX_FRAMES, true);
  req(p.run.PIC_SCALE, 'PIC_SCALE', 0.01);
  req(p.run.FRAMES_PER_OUTPUT, 'FRAMES_PER_OUTPUT', 1, undefined, true);
  req(p.run.GIF_FPS, 'GIF_FPS', 1);
  if (!['auto', 'custom', 'uxsim'].includes(p.run.GIF_ENGINE)){
    e.push('GIF_ENGINE 只能是 auto / custom / uxsim');
  }
  req(p.run.GIF_TIMESTEP_SKIP, 'GIF_TIMESTEP_SKIP', 1, undefined, true);
  if (p.run.SEED !== null && (!Number.isInteger(p.run.SEED) || p.run.SEED < 0)){
    e.push('SEED 必须是空或非负整数');
  }

  req(p.road.max_lanes, 'max_lanes', 1, 20, true);
  req(p.road.max_degree, 'max_degree', 1, 20, true);
  req(p.road.edge_prob, 'edge_prob', 0, 1);
  req(p.road.connection_limit, 'connection_limit', 0, undefined, true);
  req(p.road.exp_road_length, 'exp_road_length', 0.01);
  req(p.road.var_road_length, 'var_road_length', 0, 0.99);
  req(p.road.angle_variation, 'angle_variation', 0, Math.PI);

  if (!Array.isArray(p.road.force_single_road) ||
      p.road.force_single_road.some(v => !Number.isInteger(v))){
    e.push('force_single_road 必须是整数数组，例如 [12, 18]');
  }

  req(p.cars.num_cars_initially, 'num_cars_initially', 0, MAX_CARS, true);
  req(p.cars.new_car_prob, 'new_car_prob', 0, 1);
  if (!Array.isArray(p.cars.new_car_range) || p.cars.new_car_range.length !== 2 ||
      p.cars.new_car_range.some(v => !Number.isInteger(v)) ||
      p.cars.new_car_range[0] < 1 ||
      p.cars.new_car_range[0] > p.cars.new_car_range[1]){
    e.push('new_car_range 必须是 [低, 高] 两个正整数，且低 <= 高');
  }
  req(p.cars.spawn_interval, 'spawn_interval', 1, MAX_FRAMES, true);

  req(p.simulator.standard_speed, 'standard_speed', 0.01);
  req(p.simulator.car_length, 'car_length', 0.000001);
  req(p.simulator.minimum_distance, 'minimum_distance', 0);
  req(p.simulator.reaction_time, 'reaction_time', 0.0000001);
  req(p.simulator.minimum_speed, 'minimum_speed', 0);
  req(p.simulator.meters_per_unit, 'meters_per_unit', 0.000001);
  req(p.simulator.jam_density, 'jam_density', 0.000001);
  req(p.simulator.lane_speed_step, 'lane_speed_step', 0);
  req(p.simulator.idm_accel, 'idm_accel', 0.000001);
  req(p.simulator.idm_decel, 'idm_decel', 0.000001);
  req(p.simulator.idm_time_gap, 'idm_time_gap', 0);
  req(p.simulator.idm_min_gap, 'idm_min_gap', 0);
  req(p.simulator.idm_delta, 'idm_delta', 0.000001);
  req(p.simulator.log_every, 'log_every', 1, undefined, true);

  return e;
}

function graphComponents(){
  const adj = new Map(S.nodes.map(n => [n.id, []]));
  for (const r of S.roads){
    if (adj.has(r.a) && adj.has(r.b)){
      adj.get(r.a).push(r.b);
      adj.get(r.b).push(r.a);
    }
  }
  const seen = new Set();
  let comps = 0;
  for (const n of S.nodes){
    if (seen.has(n.id)) continue;
    comps += 1;
    const stack = [n.id];
    seen.add(n.id);
    while (stack.length){
      const u = stack.pop();
      for (const v of adj.get(u) || []){
        if (!seen.has(v)){ seen.add(v); stack.push(v); }
      }
    }
  }
  return comps;
}

function validateAll(){
  const errors = validateParams();
  const warnings = [];
  const p = S.params;

  if (S.nodes.length < 2) errors.push('至少需要 2 个节点才能形成道路');
  if (S.roads.length < 1) errors.push('至少需要 1 条道路');

  const ids = new Set();
  for (const n of S.nodes){
    if (ids.has(n.id)) errors.push(`节点 id 重复：${n.id}`);
    ids.add(n.id);
    if (!Number.isFinite(n.x) || !Number.isFinite(n.y)){
      errors.push(`节点 ${n.id} 坐标不是有限数字`);
    }
  }

  const pairs = new Set();
  const deg = new Map(S.nodes.map(n => [n.id, 0]));
  for (const r of S.roads){
    const a = nodeById(r.a);
    const b = nodeById(r.b);
    if (!a || !b) errors.push(`道路 ${r.id} 的端点不存在`);
    if (r.a === r.b) errors.push(`道路 ${r.id} 不能是自环`);
    if (!Number.isInteger(r.lanes) || r.lanes < 1 || r.lanes > p.road.max_lanes){
      errors.push(`道路 ${r.id} 的 lanes 必须在 1..${p.road.max_lanes}`);
    }
    if (roadLength(r) <= 0.01){
      errors.push(`道路 ${r.a} ↔ ${r.b} 长度接近 0，请把两个节点分开`);
    }
    const key = r.a < r.b ? `${r.a}-${r.b}` : `${r.b}-${r.a}`;
    if (pairs.has(key)) errors.push(`道路 ${r.a} ↔ ${r.b} 重复`);
    pairs.add(key);
    if (deg.has(r.a)) deg.set(r.a, deg.get(r.a) + 1);
    if (deg.has(r.b)) deg.set(r.b, deg.get(r.b) + 1);
  }

  for (const n of S.nodes){
    if ((deg.get(n.id) || 0) === 0) warnings.push(`节点 ${n.id} 是孤立节点`);
  }
  if (S.nodes.length && graphComponents() > 1){
    warnings.push('路网不连通：车辆可能无法从部分起点到达终点');
  }

  const init = p.cars.num_cars_initially;
  if (Number.isInteger(init) && init > WARN_CARS){
    warnings.push(`初始车辆数 ${init} 较大，仿真会较慢`);
  }
  if (Number.isInteger(init) && init > MAX_CARS){
    errors.push(`初始车辆数超过编辑器上限 ${MAX_CARS}`);
  }

  if (p.run.GENERATE_GIF && p.run.GIF_ENGINE === 'custom' && !p.run.SHOW_MID_PROCESS){
    warnings.push('GIF_ENGINE=custom 但没有过程帧，main.py 不会生成自定义 GIF');
  }
  if (p.run.GENERATE_GIF && p.run.GIF_ENGINE === 'uxsim' &&
      Number.isFinite(p.run.FPS) && p.run.FPS > 0 &&
      Number.isInteger(p.run.FRAMES) && Number.isInteger(p.run.GIF_TIMESTEP_SKIP) &&
      p.run.GIF_TIMESTEP_SKIP > 0){
    const nativeFrames = Math.ceil(((p.run.FRAMES + 1) * 3600 / p.run.FPS) / p.run.GIF_TIMESTEP_SKIP);
    if (nativeFrames > 1200){
      warnings.push(`UXsim 原生 GIF 约 ${nativeFrames} 帧，生成会较慢；可增大 GIF_TIMESTEP_SKIP`);
    }
  }

  for (const c of S.manualCars){
    if (!nodeById(c.start) || !nodeById(c.goal)){
      errors.push(`手工车辆 #${c.uid} 的起点/终点不存在`);
    } else if (c.start === c.goal){
      errors.push(`手工车辆 #${c.uid} 的起点和终点不能相同`);
    }
    if (!Number.isInteger(c.frame) || c.frame < 0 || c.frame > p.run.FRAMES){
      errors.push(`手工车辆 #${c.uid} 的生成帧必须在 0..${p.run.FRAMES}`);
    }
  }

  const frames = p.run.FRAMES;
  if (Number.isInteger(frames)){
    const seenFrames = new Set();
    for (const pt of S.curve){
      if (!Number.isInteger(pt.frame) || pt.frame < 0 || pt.frame > frames){
        errors.push('曲线控制点的帧必须在 0..FRAMES');
      }
      if (!Number.isFinite(pt.count) || pt.count < 0){
        errors.push('曲线控制点的车辆数必须是非负数');
      }
      if (seenFrames.has(pt.frame)) errors.push(`曲线在帧 ${pt.frame} 有重复控制点`);
      seenFrames.add(pt.frame);
    }
  }

  const initial = Number.isInteger(init) ? init : 0;
  const manual = S.manualCars.length;
  let total = initial + manual;
  if (S.carMode === 'curve'){
    const curveCars = curveExpectedTotal();
    total += curveCars;
    if (curveCars + initial + manual === 0){
      warnings.push('曲线和初始车辆都是 0，导出后不会生成任何车');
    }
    const interval = spawnInterval();
    if (Number.isInteger(frames) && interval > frames){
      warnings.push('触发间隔大于 FRAMES，只会在第 0 帧触发一次');
    }
  } else {
    const pr = p.cars.new_car_prob;
    const avg = Array.isArray(p.cars.new_car_range)
      ? (p.cars.new_car_range[0] + p.cars.new_car_range[1]) / 2 : 2;
    const expected = initial + manual + (Number.isFinite(pr) && Number.isFinite(frames)
      ? Math.max(0, pr) * frames * Math.max(0, avg) : 0);
    total = expected;
    if (curveExpectedTotal() > 0){
      warnings.push('当前是“旧随机”模式，曲线不参与导出');
    }
  }

  const totalText = Number.isInteger(total) ? String(total) : total.toFixed(1);
  if (total > MAX_CARS){
    errors.push(`预计车辆数 ${totalText} 超过编辑器上限 ${MAX_CARS}`);
  } else if (total > WARN_CARS){
    warnings.push(`预计车辆数 ${totalText} 较大，导出和回放会变慢`);
  }

  if (Array.isArray(p.road.force_single_road)){
    const missing = p.road.force_single_road.filter(id => !nodeById(id));
    if (missing.length) warnings.push(`force_single_road 中有不存在的节点：${missing.join(', ')}`);
  }

  return {errors, warnings};
}

function spawnInterval(){
  const v = Number(S.params.cars.spawn_interval);
  return Number.isInteger(v) && v >= 1 ? v : 1;
}

function curveExpectedTotal(){
  const frames = S.params.run.FRAMES;
  if (!Number.isInteger(frames) || frames < 0) return 0;
  const interval = spawnInterval();
  let total = 0;
  for (let t = 0; t <= frames; t += interval){
    total += Math.max(0, curveValueAt(t));
    if (total > MAX_CARS + 1) return total;
  }
  return total;
}

/* ================================================================== *
 *  Curve interpolation
 * ================================================================== */
function sortedCurve(){
  return S.curve.slice().sort((a, b) => a.frame - b.frame || a.uid - b.uid);
}

function curveValueAt(frame){
  const pts = sortedCurve();
  if (!pts.length) return 0;
  if (frame <= pts[0].frame) return frame === pts[0].frame ? pts[0].count : 0;
  if (frame >= pts[pts.length - 1].frame){
    return frame === pts[pts.length - 1].frame ? pts[pts.length - 1].count : 0;
  }
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i + 1];
    if (frame >= a.frame && frame <= b.frame){
      const t = (frame - a.frame) / (b.frame - a.frame);
      return a.count + t * (b.count - a.count);
    }
  }
  return 0;
}

function adjustCurveFrames(oldFrames, newFrames){
  if (!Number.isInteger(newFrames) || newFrames < 0) return;
  for (const p of S.curve){
    if (p.frame === oldFrames) p.frame = newFrames;
    else p.frame = clamp(p.frame, 0, newFrames);
  }
  const seen = new Set();
  S.curve = sortedCurve().filter(p => {
    if (seen.has(p.frame)) return false;
    seen.add(p.frame);
    return true;
  });
  if (!S.curve.find(p => p.uid === S.curveSelected)) S.curveSelected = null;
}

/* ================================================================== *
 *  Map rendering / editing
 * ================================================================== */
function drawMap(){
  const svg = $('map');
  svg.innerHTML = '';

  const gGrid = document.createElementNS(NS, 'g');
  gGrid.setAttribute('pointer-events', 'none');
  for (let x = 0; x <= MAP_W; x += 10){
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', x); l.setAttribute('y1', 0);
    l.setAttribute('x2', x); l.setAttribute('y2', MAP_H);
    l.setAttribute('class', 'gridLine');
    gGrid.appendChild(l);
  }
  for (let y = 0; y <= MAP_H; y += 10){
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 0); l.setAttribute('y1', y);
    l.setAttribute('x2', MAP_W); l.setAttribute('y2', y);
    l.setAttribute('class', 'gridLine');
    gGrid.appendChild(l);
  }
  svg.appendChild(gGrid);

  const gRoads = document.createElementNS(NS, 'g');
  const gNodes = document.createElementNS(NS, 'g');
  svg.appendChild(gRoads);
  svg.appendChild(gNodes);

  for (const r of S.roads){
    const a = nodeById(r.a), b = nodeById(r.b);
    if (!a || !b) continue;
    const selected = S.selected && S.selected.type === 'road' && S.selected.id === r.id;
    const width = Math.max(0.35, r.lanes * 0.42);
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('stroke', selected ? '#58a6ff' : '#8796a5');
    line.setAttribute('stroke-width', width + (selected ? 0.35 : 0));
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('opacity', selected ? 0.95 : 0.72);
    line.setAttribute('pointer-events', 'none');
    gRoads.appendChild(line);

    const hit = document.createElementNS(NS, 'line');
    hit.setAttribute('x1', a.x); hit.setAttribute('y1', a.y);
    hit.setAttribute('x2', b.x); hit.setAttribute('y2', b.y);
    hit.setAttribute('stroke', 'rgba(0,0,0,0.001)');
    hit.setAttribute('stroke-width', Math.max(2.5, width + 1.6));
    hit.setAttribute('pointer-events', 'stroke');
    hit.setAttribute('data-road-id', r.id);
    hit.style.cursor = S.tab === 'roads' ? 'pointer' : 'default';
    hit.addEventListener('click', ev => {
      ev.stopPropagation();
      if (S.tab !== 'roads') return;
      select({type:'road', id:r.id});
      drawMap();
      renderSide();
    });
    gRoads.appendChild(hit);
  }

  for (const n of S.nodes){
    const selected = S.selected && S.selected.type === 'node' && S.selected.id === n.id;
    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('cx', n.x);
    circle.setAttribute('cy', n.y);
    circle.setAttribute('r', 1.5);
    circle.setAttribute('fill', selected ? '#58a6ff' : '#9fb4c7');
    circle.setAttribute('stroke', selected ? '#cfe6ff' : '#0d1218');
    circle.setAttribute('stroke-width', selected ? 0.45 : 0.25);
    circle.style.cursor = S.tab === 'roads' ? 'grab' : 'default';
    circle.addEventListener('pointerdown', ev => beginNodeInteraction(ev, n));
    circle.addEventListener('click', ev => ev.stopPropagation());
    gNodes.appendChild(circle);

    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', n.x);
    label.setAttribute('y', n.y - 2.2);
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('fill', '#b8c7d6');
    label.setAttribute('font-size', '2.2');
    label.setAttribute('class', 'nodeLabel');
    label.textContent = String(n.id);
    gNodes.appendChild(label);
  }

  if (!S.nodes.length){
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', MAP_W / 2);
    t.setAttribute('y', MAP_H / 2);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('fill', '#8b98a5');
    t.setAttribute('font-size', '2.6');
    t.textContent = S.tab === 'params'
      ? '在「道路设置」中添加节点'
      : '点击「添加节点」后在这里放置节点';
    t.setAttribute('pointer-events', 'none');
    gNodes.appendChild(t);
  }

  if (S.connect && S.connect.line){
    svg.appendChild(S.connect.line);
  }
  updateMapHint();
  updateToolbar();
}

function updateMapHint(){
  if (S.tab !== 'roads'){
    $('mapHint').textContent = '参数预览：在「道路设置」中编辑节点和道路。';
    return;
  }
  const hints = {
    select: '选择/移动：点击节点/道路选中；拖动节点移动；点击空白取消选择。',
    add: '添加节点：点击地图空白处放置节点；放完可切换到「选择/移动」。',
    connect: '连线：从一个节点拖到另一个节点创建道路；自环/重复边会被拒绝。'
  };
  $('mapHint').textContent = hints[S.tool] || '';
}

function updateToolbar(){
  document.querySelectorAll('#toolbar [data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === S.tool);
  });
  const del = $('btnDeleteSel');
  if (del) del.disabled = !S.selected;
}

function svgPoint(e, svg){
  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function mapPoint(e){
  const p = svgPoint(e, $('map'));
  return {x: clamp(p.x, 2, MAP_W - 2), y: clamp(p.y, 2, MAP_H - 2)};
}

function nearestNode(x, y, maxDist){
  let best = null;
  let bestD = maxDist;
  for (const n of S.nodes){
    const d = Math.hypot(n.x - x, n.y - y);
    if (d <= bestD){ best = n; bestD = d; }
  }
  return best;
}

function addNodeAt(x, y){
  if (S.nodes.some(n => Math.hypot(n.x - x, n.y - y) < 1.2)){
    toast('这个位置离已有节点太近');
    return null;
  }
  const node = {id: S.nodes.length, x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100};
  S.nodes.push(node);
  select({type:'node', id:node.id});
  drawMap();
  renderSide();
  updateChrome();
  return node;
}

function addRoadBetween(aId, bId){
  if (aId === bId){ toast('不能创建自环'); return null; }
  const exists = S.roads.some(r =>
    (r.a === aId && r.b === bId) || (r.a === bId && r.b === aId));
  if (exists){ toast('这两个节点之间已经有道路'); return null; }
  const road = {id: S.roads.length, a: aId, b: bId, lanes: 1};
  S.roads.push(road);
  select({type:'road', id:road.id});
  drawMap();
  renderSide();
  updateChrome();
  return road;
}

function select(sel){
  S.selected = sel;
  updateToolbar();
}

function clearSelection(){
  S.selected = null;
  updateToolbar();
  if (S.tab === 'roads') renderSide();
}

function beginNodeInteraction(e, node){
  if (S.tab !== 'roads' || e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  select({type:'node', id:node.id});
  drawMap();
  renderSide();

  if (S.tool === 'connect' || e.shiftKey){
    startConnect(e, node);
  } else if (S.tool === 'select'){
    startNodeDrag(e, node);
  }
}

function startNodeDrag(e, node){
  const p = mapPoint(e);
  S.drag = {node, offX: node.x - p.x, offY: node.y - p.y};
}

function startConnect(e, node){
  const p = mapPoint(e);
  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', node.x); line.setAttribute('y1', node.y);
  line.setAttribute('x2', p.x); line.setAttribute('y2', p.y);
  line.setAttribute('stroke', '#58a6ff');
  line.setAttribute('stroke-width', 0.5);
  line.setAttribute('stroke-dasharray', '1.4 1.0');
  line.setAttribute('pointer-events', 'none');
  $('map').appendChild(line);
  S.connect = {from: node, line};
}

function finishConnect(e){
  if (!S.connect) return;
  const p = mapPoint(e);
  const target = nearestNode(p.x, p.y, 4);
  const from = S.connect.from;
  if (S.connect.line && S.connect.line.parentNode) S.connect.line.remove();
  S.connect = null;
  S.suppressClickUntil = Date.now() + 150;
  if (target && target.id !== from.id){
    addRoadBetween(from.id, target.id);
  }
}

function finishNodeDrag(){
  if (!S.drag) return;
  S.drag = null;
  S.suppressClickUntil = Date.now() + 150;
  renderSide();
  updateChrome();
}

function onGlobalPointerMove(e){
  if (S.drag){
    const p = mapPoint(e);
    const n = S.drag.node;
    n.x = Math.round(clamp(p.x + S.drag.offX, 1, MAP_W - 1) * 100) / 100;
    n.y = Math.round(clamp(p.y + S.drag.offY, 1, MAP_H - 1) * 100) / 100;
    drawMap();
    return;
  }
  if (S.connect){
    const p = mapPoint(e);
    const target = nearestNode(p.x, p.y, 4);
    const line = S.connect.line;
    if (line){
      line.setAttribute('x2', target ? target.x : p.x);
      line.setAttribute('y2', target ? target.y : p.y);
    }
    return;
  }
  if (S.curveDrag){
    const uid = S.curveDrag.uid;
    const pt = chartPointFromEvent(e);
    if (!pt) return;
    const p = S.curve.find(x => x.uid === uid);
    if (!p) return;
    const occupied = S.curve.some(x => x.uid !== uid && x.frame === pt.frame);
    if (!occupied) p.frame = pt.frame;
    p.count = pt.count;
    S.curve = sortedCurve();
    drawChart();
    return;
  }
}

function onGlobalPointerUp(e){
  if (S.drag){ finishNodeDrag(); return; }
  if (S.connect){ finishConnect(e); return; }
  if (S.curveDrag){
    S.curveDrag = null;
    S.suppressClickUntil = Date.now() + 150;
    renderSide();
    updateChrome();
  }
}

function onMapClick(e){
  if (S.tab !== 'roads') return;
  if (Date.now() < S.suppressClickUntil) return;
  if (e.target !== $('map')) return;
  if (S.tool === 'add'){
    const p = mapPoint(e);
    const near = nearestNode(p.x, p.y, 3);
    if (near){
      select({type:'node', id:near.id});
      drawMap();
      renderSide();
    } else {
      addNodeAt(p.x, p.y);
    }
  } else if (S.tool === 'select'){
    clearSelection();
  } else {
    if (S.connect){
      if (S.connect.line && S.connect.line.parentNode) S.connect.line.remove();
      S.connect = null;
    }
  }
}

function deleteSelected(){
  if (S.tab === 'cars' && S.curveSelected !== null){
    deleteCurvePoint(S.curveSelected);
    return;
  }
  if (S.tab !== 'roads' || !S.selected) return;
  if (S.selected.type === 'node'){
    deleteNode(S.selected.id);
  } else if (S.selected.type === 'road'){
    deleteRoad(S.selected.id);
  }
}

function deleteNode(id){
  const node = nodeById(id);
  if (!node) return;
  const nRoads = connectedRoadsOfNode(id).length;
  if (!confirm(`删除节点 ${id} 及其 ${nRoads} 条连接道路？`)) return;
  S.nodes = S.nodes.filter(n => n.id !== id);
  S.roads = S.roads.filter(r => r.a !== id && r.b !== id);
  S.manualCars = S.manualCars.filter(c => c.start !== id && c.goal !== id);
  reindexEntities();
  S.selected = null;
  drawMap();
  renderSide();
  updateChrome();
  toast(`已删除节点 ${id}`);
}

function deleteRoad(id){
  const road = roadById(id);
  if (!road) return;
  S.roads = S.roads.filter(r => r.id !== id);
  reindexRoads();
  S.selected = null;
  drawMap();
  renderSide();
  updateChrome();
  toast('已删除道路');
}

function reindexRoads(){
  S.roads.forEach((r, i) => { r.id = i; });
}

function reindexEntities(){
  const map = new Map();
  S.nodes.forEach((n, i) => { map.set(n.id, i); });
  S.nodes.forEach((n, i) => { n.id = i; });
  S.roads = S.roads.filter(r => map.has(r.a) && map.has(r.b));
  S.roads.forEach((r, i) => {
    r.a = map.get(r.a);
    r.b = map.get(r.b);
    r.id = i;
  });
  S.manualCars = S.manualCars.filter(c => map.has(c.start) && map.has(c.goal));
  S.manualCars.forEach(c => {
    c.start = map.get(c.start);
    c.goal = map.get(c.goal);
  });
}

/* ================================================================== *
 *  Chart rendering / editing
 * ================================================================== */
function chartGeom(){
  const x0 = CHART.left;
  const x1 = CHART.w - CHART.right;
  const y0 = CHART.top;
  const y1 = CHART.h - CHART.bottom;
  const maxCount = Math.max(0, ...S.curve.map(p => p.count));
  // Below 5 cars/events use half-unit or finer ticks; above that keep the
  // familiar multiples of 5. This keeps 0.1-probability curves readable.
  let yMax;
  if (maxCount <= 5){
    yMax = Math.max(1, Math.ceil(maxCount * 1.2 * 2) / 2);
  } else {
    yMax = Math.ceil(maxCount * 1.2 / 5) * 5;
  }
  const step = yMax / 5;
  return {x0, x1, y0, y1, yMax, step};
}

function chartX(frame){
  const g = chartGeom();
  const frames = Math.max(1, S.params.run.FRAMES);
  return g.x0 + (frame / frames) * (g.x1 - g.x0);
}

function chartY(count){
  const g = chartGeom();
  return g.y1 - (count / g.yMax) * (g.y1 - g.y0);
}

function chartFrameAt(x){
  const g = chartGeom();
  const frames = Math.max(1, S.params.run.FRAMES);
  return Math.round(clamp((x - g.x0) / (g.x1 - g.x0), 0, 1) * frames);
}

function chartCountAt(y){
  const g = chartGeom();
  const v = clamp((g.y1 - y) / (g.y1 - g.y0), 0, 1) * g.yMax;
  return Math.max(0, Math.round(v * 10) / 10);
}

function chartPointFromEvent(e){
  const svg = $('chart');
  const p = svgPoint(e, svg);
  // The SVG uses preserveAspectRatio=xMidYMid meet. Convert through the
  // viewBox by using the inverse screen matrix already applied above.
  return {frame: chartFrameAt(p.x), count: chartCountAt(p.y), x: p.x, y: p.y};
}

function drawChart(){
  const svg = $('chart');
  svg.innerHTML = '';
  const g = chartGeom();
  const frames = Math.max(1, S.params.run.FRAMES);
  const NS2 = NS;

  const bg = document.createElementNS(NS2, 'rect');
  bg.setAttribute('x', g.x0); bg.setAttribute('y', g.y0);
  bg.setAttribute('width', g.x1 - g.x0); bg.setAttribute('height', g.y1 - g.y0);
  bg.setAttribute('fill', '#111820');
  svg.appendChild(bg);

  for (let i = 0; i <= 5; i++){
    const v = g.yMax * i / 5;
    const y = chartY(v);
    const line = document.createElementNS(NS2, 'line');
    line.setAttribute('x1', g.x0); line.setAttribute('x2', g.x1);
    line.setAttribute('y1', y); line.setAttribute('y2', y);
    line.setAttribute('class', 'gridLine');
    svg.appendChild(line);
    const text = document.createElementNS(NS2, 'text');
    text.setAttribute('x', g.x0 - 8);
    text.setAttribute('y', y + 4);
    text.setAttribute('text-anchor', 'end');
    text.setAttribute('class', 'chartLabel');
    text.textContent = Math.abs(g.step - Math.round(g.step)) > 1e-9
      ? v.toFixed(1) : String(Math.round(v));
    svg.appendChild(text);
  }
  for (let i = 0; i <= 4; i++){
    const frame = Math.round(frames * i / 4);
    const x = chartX(frame);
    const line = document.createElementNS(NS2, 'line');
    line.setAttribute('x1', x); line.setAttribute('x2', x);
    line.setAttribute('y1', g.y0); line.setAttribute('y2', g.y1);
    line.setAttribute('class', 'gridLine');
    svg.appendChild(line);
    const text = document.createElementNS(NS2, 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', g.y1 + 22);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'chartLabel');
    text.textContent = frame.toLocaleString();
    svg.appendChild(text);
  }

  const axisX = document.createElementNS(NS2, 'line');
  axisX.setAttribute('x1', g.x0); axisX.setAttribute('x2', g.x1);
  axisX.setAttribute('y1', g.y1); axisX.setAttribute('y2', g.y1);
  axisX.setAttribute('class', 'axisLine');
  svg.appendChild(axisX);
  const axisY = document.createElementNS(NS2, 'line');
  axisY.setAttribute('x1', g.x0); axisY.setAttribute('x2', g.x0);
  axisY.setAttribute('y1', g.y0); axisY.setAttribute('y2', g.y1);
  axisY.setAttribute('class', 'axisLine');
  svg.appendChild(axisY);

  const xLab = document.createElementNS(NS2, 'text');
  xLab.setAttribute('x', (g.x0 + g.x1) / 2);
  xLab.setAttribute('y', CHART.h - 8);
  xLab.setAttribute('text-anchor', 'middle');
  xLab.setAttribute('class', 'chartLabel');
  xLab.textContent = '帧';
  svg.appendChild(xLab);

  const yLab = document.createElementNS(NS2, 'text');
  yLab.setAttribute('x', 18);
  yLab.setAttribute('y', (g.y0 + g.y1) / 2);
  yLab.setAttribute('text-anchor', 'middle');
  yLab.setAttribute('transform', `rotate(-90 18 ${(g.y0 + g.y1) / 2})`);
  yLab.setAttribute('class', 'chartLabel');
  yLab.textContent = '每事件车辆数 / 概率';
  svg.appendChild(yLab);

  const pts = sortedCurve();
  const linePts = [];
  if (!pts.length){
    linePts.push({frame:0, count:0}, {frame:frames, count:0});
  } else {
    if (pts[0].frame > 0) linePts.push({frame:0, count:0});
    for (const p of pts) linePts.push({frame:p.frame, count:p.count});
    if (pts[pts.length - 1].frame < frames) linePts.push({frame:frames, count:0});
  }
  const path = document.createElementNS(NS2, 'path');
  const d = linePts.map((p, i) => {
    return `${i ? 'L' : 'M'} ${chartX(p.frame)} ${chartY(p.count)}`;
  }).join(' ');
  path.setAttribute('d', d);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#58a6ff');
  path.setAttribute('stroke-width', 2.2);
  path.setAttribute('stroke-linejoin', 'round');
  path.setAttribute('pointer-events', 'none');
  svg.appendChild(path);

  const clickRect = document.createElementNS(NS2, 'rect');
  clickRect.setAttribute('x', g.x0); clickRect.setAttribute('y', g.y0);
  clickRect.setAttribute('width', g.x1 - g.x0);
  clickRect.setAttribute('height', g.y1 - g.y0);
  clickRect.setAttribute('fill', '#000');
  clickRect.setAttribute('opacity', '0');
  clickRect.setAttribute('pointer-events', 'all');
  clickRect.style.cursor = 'crosshair';
  clickRect.addEventListener('click', ev => {
    ev.stopPropagation();
    if (S.tab !== 'cars' || Date.now() < S.suppressClickUntil) return;
    const pt = chartPointFromEvent(ev);
    const existing = S.curve.find(p => p.frame === pt.frame);
    if (existing){
      S.curveSelected = existing.uid;
    } else {
      S.curve.push({uid: nextUid(), frame: pt.frame, count: pt.count});
      S.curve = sortedCurve();
      S.curveSelected = S.curve.find(p => p.frame === pt.frame).uid;
    }
    drawChart();
    renderSide();
    updateChrome();
  });
  svg.appendChild(clickRect);

  for (const p of pts){
    const circle = document.createElementNS(NS2, 'circle');
    circle.setAttribute('cx', chartX(p.frame));
    circle.setAttribute('cy', chartY(p.count));
    circle.setAttribute('r', S.curveSelected === p.uid ? 8 : 5.5);
    circle.setAttribute('fill', S.curveSelected === p.uid ? '#58a6ff' : '#d9ef8b');
    circle.setAttribute('stroke', '#0d1218');
    circle.setAttribute('stroke-width', 1.5);
    circle.style.cursor = 'grab';
    circle.addEventListener('pointerdown', ev => {
      if (S.tab !== 'cars' || ev.button !== 0) return;
      ev.preventDefault(); ev.stopPropagation();
      S.curveSelected = p.uid;
      S.curveDrag = {uid:p.uid};
      drawChart();
      renderSide();
    });
    circle.addEventListener('contextmenu', ev => {
      ev.preventDefault(); ev.stopPropagation();
      deleteCurvePoint(p.uid);
    });
    svg.appendChild(circle);
  }
}

function deleteCurvePoint(uid){
  S.curve = S.curve.filter(p => p.uid !== uid);
  if (S.curveSelected === uid) S.curveSelected = null;
  drawChart();
  renderSide();
  updateChrome();
}

function clearCurve(){
  if (!S.curve.length) return;
  if (!confirm('清空整条车辆曲线？')) return;
  S.curve = [];
  S.curveSelected = null;
  drawChart();
  renderSide();
  updateChrome();
}

function fieldNum(label, path, value, unit, help, step){
  return `<label class="field">
    <span class="head"><span>${esc(label)}</span>${unit ? `<span class="unit">${esc(unit)}</span>` : ''}</span>
    <input type="number" data-path="${path}" data-kind="number" step="${step || 'any'}" value="${Number.isFinite(value) ? value : ''}">
    ${help ? `<span class="help">${esc(help)}</span>` : ''}
  </label>`;
}

function fieldInt(label, path, value, unit, help, min, max, id, disabled){
  return `<label class="field">
    <span class="head"><span>${esc(label)}</span>${unit ? `<span class="unit">${esc(unit)}</span>` : ''}</span>
    <input type="number" ${id ? `id="${id}"` : ''} data-path="${path}" data-kind="int" step="1" min="${min === undefined ? '' : min}" max="${max === undefined ? '' : max}" value="${Number.isFinite(value) ? value : ''}" ${disabled ? 'disabled' : ''}>
    ${help ? `<span class="help">${esc(help)}</span>` : ''}
  </label>`;
}

function fieldBool(label, path, checked, help){
  return `<label class="field">
    <span class="head"><span>${esc(label)}</span></span>
    <input type="checkbox" data-path="${path}" data-kind="boolean" ${checked ? 'checked' : ''}>
    ${help ? `<span class="help">${esc(help)}</span>` : ''}
  </label>`;
}

function fieldSelect(label, path, value, unit, help, options){
  const opts = options.map(([v, text]) =>
    `<option value="${esc(v)}" ${String(value) === String(v) ? 'selected' : ''}>${esc(text)}</option>`
  ).join('');
  return `<label class="field">
    <span class="head"><span>${esc(label)}</span>${unit ? `<span class="unit">${esc(unit)}</span>` : ''}</span>
    <select data-path="${path}" data-kind="text">${opts}</select>
    ${help ? `<span class="help">${esc(help)}</span>` : ''}
  </label>`;
}

function updateParamErrors(){
  const box = $('paramErrors');
  if (!box) return;
  const errs = validateParams();
  if (!errs.length){
    box.innerHTML = '<span class="ok">参数格式有效。</span>';
  } else {
    box.innerHTML = errs.map(e => `<div class="bad">• ${esc(e)}</div>`).join('');
  }
}

    }).join('');

      <div class="grid2">
        <label class="field"><span class="head"><span>x</span></span>
          <input type="number" data-node-x="1" step="0.01" value="${n.x}"></label>

          <input type="number" data-node-y="1" step="0.01" value="${n.y}"></label>

      <h3>连接的道路</h3>
      ${rows ? `<div class="scroll"><table><thead><tr><th>道路</th><th>另一端</th><th>车道</th><th>长度</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="note">这个节点还没有连接道路。</div>'}
      <div class="row" style="margin-top:10px">
        <button class="danger" data-action="delete-node">删除节点</button>
        <button data-action="deselect">取消选择</button>
      </div>`;
    return;
  }

  if (S.selected.type === 'road'){
    const r = roadById(S.selected.id);
    if (!r){ S.selected = null; return renderRoadsSide(); }
    const a = nodeById(r.a), b = nodeById(r.b);
    side.innerHTML = `
      <h2>道路 ${r.a} ↔ ${r.b}</h2>
      <div class="kv note">端点：${r.a} ↔ ${r.b}　|　长度：${fmt(roadLength(r), 3)}（自动）　|　容量估计：${fmt(roadLength(r) * r.lanes, 2)}</div>
      <label class="field">
        <span class="head"><span>lanes</span><span class="unit">条/方向</span></span>
        <input type="number" data-road-lanes="1" min="1" max="${S.params.road.max_lanes}" step="1" value="${r.lanes}">
        <span class="help">每条道路在报告中自动变成两个方向；每个方向都使用这份 lanes。最大 ${S.params.road.max_lanes}。</span>
      </label>
      <div class="note">长度 = 两端坐标的欧氏距离；导出后 main.py 会按同一几何长度建图，A* 的欧氏启发式保持一致。</div>
      <div class="row">
        <button class="danger" data-action="delete-road">删除道路</button>
        <button data-action="deselect">取消选择</button>
      </div>`;
    return;
  }
}

function addManualCar(){

    toast(`生成帧必须在 0..${S.params.run.FRAMES}`);

  S.manualCars.push({uid: nextUid(), start, goal, frame});

function deleteManualCar(uid){

}

function formatInt(v){
  return Number.isFinite(v) ? Math.round(v).toLocaleString() : '—';
}

function formatSize(kb, estimate){
  if (!Number.isFinite(kb)) return '—';
  const prefix = estimate ? '≈ ' : '';
  if (kb >= 1024) return `${prefix}${(kb / 1024).toFixed(1)} MB`;
  return `${prefix}${Math.max(0, kb).toFixed(1)} KB`;
}

function buildExportSummary(){
  const p = S.params;
  const rawInitial = Number(p.cars.num_cars_initially);
  const initial = Number.isFinite(rawInitial) ? Math.max(0, Math.trunc(rawInitial)) : 0;
  const manual = S.manualCars.length;

  let exact = null;
  try { exact = buildCarPlan(false); } catch (err) {}

  let expected = initial + manual;
  if (S.carMode === 'curve'){
    try { expected += curveExpectedTotal(); } catch (err) {}
  } else {
    const frames = Number(p.run.FRAMES);
    const prob = Number(p.cars.new_car_prob);
    const range = Array.isArray(p.cars.new_car_range) ? p.cars.new_car_range : null;
    if (Number.isFinite(frames) && Number.isFinite(prob) && range && range.length === 2 &&
        Number.isFinite(range[0]) && Number.isFinite(range[1])){
      expected += Math.max(0, prob) * Math.max(0, frames) * (range[0] + range[1]) / 2;
    }
  }

  const cars = exact !== null ? exact : Math.ceil(expected);
  const generated = Math.max(0, cars - initial - manual);
  const frames = Number(p.run.FRAMES);
  const fps = Number(p.run.FPS);
  const totalLength = S.roads.reduce((sum, r) => sum + roadLength(r), 0);
  const laneLengthUnits = 2 * S.roads.reduce((sum, r) => sum + roadLength(r) * r.lanes, 0);
  const metersPerUnit = Number(p.simulator.meters_per_unit);
  const spacingM = (Number(p.simulator.car_length) + Number(p.simulator.minimum_distance)) * 1000;
  const totalKm = Number.isFinite(metersPerUnit) ? totalLength * metersPerUnit / 1000 : null;
  const laneKm = Number.isFinite(metersPerUnit) ? laneLengthUnits * metersPerUnit / 1000 : null;
  const staticCapacity = Number.isFinite(metersPerUnit) && spacingM > 0
    ? laneLengthUnits * metersPerUnit / spacingM : null;
  const hours = Number.isFinite(frames) && Number.isFinite(fps) && fps > 0
    ? (frames + 1) / fps : null;

  return {
    exact: exact !== null,
    cars,
    initial,
    manual,
    generated,
    nodes: S.nodes.length,
    roads: S.roads.length,
    directions: S.roads.length * 2,
    totalKm,
    laneKm,
    capacityUnits: laneLengthUnits,
    staticCapacity,
    frames: Number.isFinite(frames) ? frames : null,
    fps: Number.isFinite(fps) ? fps : null,
    hours,
    mode: S.carMode === 'curve' ? '曲线生成' : '旧随机',
    interval: S.carMode === 'curve' ? spawnInterval() : null,
    seed: p.run.SEED === null ? '会话随机' : p.run.SEED,
    fileKB: null,
    fileEstimate: false
  };
}

function refreshExportView(){
  if (S.tab !== 'export') return;
  const errBox = $('exportErrors');
  const metaBox = $('exportMeta');
  const preview = $('jsonPreview');
  if (!errBox || !metaBox || !preview) return;

  const v = validateAll();
  const summary = buildExportSummary();
  const parts = [];
  for (const e of v.errors) parts.push(`<div class="bad">✗ ${esc(e)}</div>`);
  for (const w of v.warnings) parts.push(`<div class="warn">！${esc(w)}</div>`);
  errBox.innerHTML = parts.length ? parts.join('') : '<div class="ok">校验通过。</div>';
  renderExportStats(summary);

  const btn = document.querySelector('[data-action="download"]');
  const copy = document.querySelector('[data-action="copy"]');
  if (btn) btn.disabled = true;
  if (copy) copy.disabled = true;

  if (v.errors.length){
    metaBox.textContent = `节点 ${S.nodes.length} · 道路 ${S.roads.length} · 车辆计划试算 ${formatInt(summary.cars)} 辆（先修复错误）`;
    preview.textContent = '// 校验未通过，请先修复右侧列出的错误。\n// 上方摘要仍按当前参数试算车辆数与容量。';
    return;
  }

  if (summary.cars !== null && summary.cars > PREVIEW_CARS_LIMIT){
    summary.fileKB = summary.cars * 52 / 1024 + 2;
    summary.fileEstimate = true;
    renderExportStats(summary);
    metaBox.textContent = `车辆 ${formatInt(summary.cars)} 辆，超过完整预览阈值 ${formatInt(PREVIEW_CARS_LIMIT)} 辆；已跳过 JSON 预览，点击「导出 JSON」生成紧凑文件。`;
    preview.textContent = '// 车辆数较大，已跳过完整 JSON 预览。\n// 右侧摘要显示实际计划车辆数；点击“导出 JSON”生成文件。';
    if (btn) btn.disabled = false;
    return;
  }

  try {
    const tpl = buildTemplate();
    const compact = JSON.stringify(tpl);
    const pretty = JSON.stringify(tpl, null, 2);
    preview.textContent = pretty;
    summary.cars = tpl.cars.length;
    summary.exact = true;
    summary.generated = Math.max(0, summary.cars - summary.initial - summary.manual);
    summary.fileKB = new Blob([compact]).size / 1024;
    summary.fileEstimate = false;
    renderExportStats(summary);
    metaBox.textContent = `模板已生成；文件约 ${formatSize(summary.fileKB, false)}（下载为紧凑 JSON）。`;
    if (btn) btn.disabled = false;
    if (copy) copy.disabled = false;
  } catch (err){
    metaBox.textContent = '生成模板失败';
    errBox.innerHTML += `<div class="bad">✗ ${esc(err.message)}</div>`;
    preview.textContent = '// ' + String(err.message);
  }
}

/* ================================================================== *
 *  Template builder
 * ================================================================== */
function buildTemplate(){
  const v = validateAll();
  if (v.errors.length) throw new Error(v.errors.join('；'));

  const p = S.params;
  const nodes = S.nodes.map(n => ({
    id: n.id,
    pos: [Math.round(n.x * 10000) / 10000, Math.round(n.y * 10000) / 10000],
    tiled_pos: [Math.round(n.x), Math.round(n.y)],
    connection: [null, null, null, null],
    degrees: nodeDegree(n.id)
  }));

  const roads = S.roads.map((r, i) => ({
    id: i,
    ptA: r.a,
    ptB: r.b,
    length: Math.round(roadLength(r) * 10000) / 10000,
    lanes: r.lanes
  }));

  const congestion = [];
  for (const r of roads){
    for (const [from, to] of [[r.ptA, r.ptB], [r.ptB, r.ptA]]){
      congestion.push({
        road: r.id,
        from,
        to,
        lanes: r.lanes,
        congestion_logs: [],
        cars: 0,
        density: 0,
        v_mean: 0,
        speed_ratio: 1,
        queue: 0,
        los: 'A',
        congestion: 0
      });
    }
  }

  const cars = buildCarPlan();
  const run = {
    FPS: p.run.FPS,
    FRAMES: p.run.FRAMES,
    PIC_SCALE: p.run.PIC_SCALE,
    SHOW_MID_PROCESS: p.run.SHOW_MID_PROCESS,
    FRAMES_PER_OUTPUT: p.run.FRAMES_PER_OUTPUT,
    GENERATE_GIF: p.run.GENERATE_GIF,
    GIF_FPS: p.run.GIF_FPS,
    GIF_ENGINE: p.run.GIF_ENGINE,
    GIF_TIMESTEP_SKIP: p.run.GIF_TIMESTEP_SKIP,
    SEED: p.run.SEED
  };

  return {
    schema: 2,
    params: {
      road: {
        num_nodes: nodes.length,
        max_lanes: p.road.max_lanes,
        max_degree: p.road.max_degree,
        edge_prob: p.road.edge_prob,
        force_single_road: Array.isArray(p.road.force_single_road) ? p.road.force_single_road.slice() : [],
        connection_limit: p.road.connection_limit,
        ring: p.road.ring,
        exp_road_length: p.road.exp_road_length,
        var_road_length: p.road.var_road_length,
        angle_variation: p.road.angle_variation
      },
      cars: {
        num_cars_initially: p.cars.num_cars_initially,
        new_car_prob: p.cars.new_car_prob,
        new_car_range: p.cars.new_car_range.slice(),
        // Editor-only extension: main.py ignores it because cars are materialized.
        spawn_interval: p.cars.spawn_interval
      },
      simulator: Object.assign({}, p.simulator),
      run,
      replay: ''
    },
    nodes,
    roads,
    congestion,
    cars,
    summary: {}
  };
}

function buildCarPlan(store){
  const keep = store !== false;
  const frames = S.params.run.FRAMES;
  const n = S.nodes.length;
  if (!Number.isInteger(frames) || frames < 0) throw new Error('FRAMES 不合法');
  if (n < 2) throw new Error('至少需要 2 个节点');

  const rand = planRng();
  const plan = [];
  let count = 0;
  const add = (frame, start, goal) => {
    if (count >= MAX_CARS) throw new Error(`车辆计划超过上限 ${MAX_CARS}`);
    count++;
    if (keep) plan.push({id: count, start, goal, spawn_frame: frame});
  };
  const pair = () => randomPair(rand, n);

  const initial = Math.max(0, Math.trunc(S.params.cars.num_cars_initially));
  for (let i = 0; i < initial; i++){
    const [a, b] = pair();
    add(0, a, b);
  }

  const manualByFrame = new Map();
  for (const c of S.manualCars){
    if (!manualByFrame.has(c.frame)) manualByFrame.set(c.frame, []);
    manualByFrame.get(c.frame).push(c);
  }

  const prob = S.params.cars.new_car_prob;
  const lo = S.params.cars.new_car_range[0];
  const hi = S.params.cars.new_car_range[1];
  const interval = spawnInterval();

  for (let t = 0; t <= frames; t++){
    const ms = manualByFrame.get(t);
    if (ms){
      for (const c of ms) add(t, c.start, c.goal);
    }
    if (S.carMode === 'curve'){
      if (t % interval !== 0) continue;
      const expected = Math.max(0, curveValueAt(t));
      const whole = Math.floor(expected);
      const fraction = expected - whole;
      for (let k = 0; k < whole; k++){
        const [a, b] = pair();
        add(t, a, b);
      }
      if (fraction > 1e-9 && rand() < fraction){
        const [a, b] = pair();
        add(t, a, b);
      }
    } else if (rand() < prob){
      const count = randInt(rand, lo, hi);
      for (let k = 0; k < count; k++){
        const [a, b] = pair();
        add(t, a, b);
      }
    }
  }
  return keep ? plan : count;
}

/* ================================================================== *
 *  Download / copy
 * ================================================================== */
function normalizedFileName(){
  let name = (S.exportName || '').trim() || `template-${stamp()}.json`;
  name = name.replace(/[\\/:*?"<>|]/g, '-');
  if (!name.toLowerCase().endsWith('.json')) name += '.json';
  return name;
}

function downloadTemplate(){
  try {
    const tpl = buildTemplate();
    const text = JSON.stringify(tpl);
    const blob = new Blob([text], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = normalizedFileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('已导出 ' + a.download);
  } catch (err){
    toast('导出失败：' + err.message);
  }
}

function copyTemplate(){
  const text = $('jsonPreview').textContent;
  if (!text || text.startsWith('//')){ toast('没有可复制的 JSON'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      () => toast('已复制 JSON'),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制 JSON'); }
  catch (e){ toast('复制失败'); }
  ta.remove();
}

/* ================================================================== *
 *  Side event handling
 * ================================================================== */
function onSideInput(e){
  const t = e.target;

  if (t.id === 'exportName'){
    S.exportName = t.value;
    return;
  }

  if (t.dataset.path){
    handleParamInput(t, 'input');
    return;
  }

  if (t.dataset.nodeX !== undefined || t.dataset.nodeY !== undefined){
    if (S.tab !== 'roads' || !S.selected || S.selected.type !== 'node') return;
    const n = nodeById(S.selected.id);
    if (!n) return;
    const val = Number(t.value);
    if (!Number.isFinite(val)) return;
    if (t.dataset.nodeX !== undefined) n.x = Math.round(clamp(val, 1, MAP_W - 1) * 100) / 100;
    if (t.dataset.nodeY !== undefined) n.y = Math.round(clamp(val, 1, MAP_H - 1) * 100) / 100;
    drawMap();
    updateChrome();
    return;
  }

  if (t.dataset.roadLanes !== undefined){
    if (S.tab !== 'roads' || !S.selected || S.selected.type !== 'road') return;
    const r = roadById(S.selected.id);
    if (!r) return;
    const val = intOrNaN(t.value);
    if (!Number.isInteger(val) || val < 1 || val > S.params.road.max_lanes) return;
    r.lanes = val;
    drawMap();
    updateChrome();
    return;
  }

  if (t.dataset.curveFrame !== undefined || t.dataset.curveCount !== undefined){
    const pt = S.curve.find(p => p.uid === S.curveSelected);
    if (!pt) return;
    if (t.dataset.curveFrame !== undefined){
      const val = intOrNaN(t.value);
      if (!Number.isInteger(val) || val < 0 || val > S.params.run.FRAMES) return;
      if (S.curve.some(p => p.uid !== pt.uid && p.frame === val)){
        toast('这一帧已经有控制点');
        t.value = pt.frame;
        return;
      }
      pt.frame = val;
    }
    if (t.dataset.curveCount !== undefined){
      const val = Number(t.value);
      if (!Number.isFinite(val) || val < 0) return;
      pt.count = Math.round(val * 10) / 10;
    }
    S.curve = sortedCurve();
    drawChart();
    updateChrome();
    return;
  }

  if (t.id === 'manualFrame'){
    return;
  }
}

function onSideChange(e){
  const t = e.target;
  if (t.name === 'carMode'){
    S.carMode = t.value;
    renderCarsSide();
    updateChrome();
    return;
  }
  if (t.dataset && t.dataset.path){
    handleParamInput(t, 'change');
  }
}

function onSideClick(e){
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'delete-node'){
    if (S.selected && S.selected.type === 'node') deleteNode(S.selected.id);
  } else if (action === 'delete-road'){
    if (S.selected && S.selected.type === 'road') deleteRoad(S.selected.id);
  } else if (action === 'deselect'){
    clearSelection();
  } else if (action === 'delete-curve-point'){
    if (S.curveSelected !== null) deleteCurvePoint(S.curveSelected);
  } else if (action === 'clear-curve'){
    clearCurve();
  } else if (action === 'add-manual'){
    addManualCar();
  } else if (action === 'delete-manual'){
    deleteManualCar(Number(btn.dataset.uid));
  } else if (action === 'refresh-name'){
    S.exportName = `template-${stamp()}.json`;
    const input = $('exportName');
    if (input) input.value = S.exportName;
    toast('已刷新时间戳文件名');
  } else if (action === 'download'){
    downloadTemplate();
  } else if (action === 'copy'){
    copyTemplate();
  }
}

function handleParamInput(input, source){
  const path = input.dataset.path;
  const kind = input.dataset.kind || 'number';
  if (!path) return;

  // FRAMES / max_lanes are destructive to derived data (curve points / road
  // lanes), so only apply them when the field is committed (change/blur), not
  // on every intermediate keystroke of "1800" or "10".
  if (source === 'input' && (path === 'run.FRAMES' || path === 'road.max_lanes')){
    return;
  }

  const oldFrames = S.params.run.FRAMES;
  let value;

  if (kind === 'boolean'){
    value = input.checked;
  } else if (kind === 'seed'){
    const raw = input.value.trim();
    value = raw === '' ? null : Number(raw);
    if (value !== null && !Number.isInteger(value)) value = NaN;
  } else if (kind === 'jsonarray'){
    try {
      value = JSON.parse(input.value);
      if (!Array.isArray(value)) value = null;
    } catch (err){
      value = null;
    }
  } else if (kind === 'text'){
    value = input.value;
  } else {
    const raw = input.value.trim();
    value = raw === '' ? NaN : Number(raw);
    if (kind === 'int' && Number.isFinite(value) && !Number.isInteger(value)) value = NaN;
  }

  setPath(S.params, path, value);

  if (path === 'run.FRAMES'){
    adjustCurveFrames(oldFrames, value);
    if (S.tab === 'cars') drawChart();
  }

  if (path === 'road.max_lanes' && Number.isFinite(value) && value >= 1){
    let clamped = false;
    for (const r of S.roads){
      if (r.lanes > value){ r.lanes = value; clamped = true; }
    }
    if (clamped) toast(`max_lanes 已降到 ${value}，相关道路车道数已同步`);
    if (S.tab === 'roads' || S.tab === 'params') drawMap();
  }

  if (path === 'cars.num_cars_initially'){
    const el = document.getElementById('carInit');
    if (el && el !== input) el.value = Number.isFinite(value) ? value : '';
  }

  updateParamErrors();
  updateChrome();
}

/* ================================================================== *
 *  Tabs and rendering
 * ================================================================== */
function setTab(tab){
  // Commit pending number-field edits (notably FRAMES / max_lanes) before
  // switching tabs, so the export never uses a half-typed value.
  const active = document.activeElement;
  if (active && typeof active.blur === 'function' && active !== document.body){
    try { active.blur(); } catch (err) {}
  }
  S.tab = tab;
  cancelInteractions();
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  $('mapWrap').classList.toggle('active', tab === 'params' || tab === 'roads');
  $('chartWrap').classList.toggle('active', tab === 'cars');
  $('jsonWrap').classList.toggle('active', tab === 'export');
  $('toolbar').style.display = tab === 'roads' ? '' : 'none';
  if (tab === 'roads' && !S.nodes.length && S.tool === 'select') S.tool = 'add';
  renderSide();
  if (tab === 'params' || tab === 'roads') drawMap();
  if (tab === 'cars') drawChart();
  updateToolbar();
  updateChrome();
}

function renderSide(){
  if (S.tab === 'params') return renderParamsSide();
  if (S.tab === 'roads') return renderRoadsSide();
  if (S.tab === 'cars') return renderCarsSide();
  if (S.tab === 'export') return renderExportSide();
}

function cancelInteractions(){
  if (S.drag) S.drag = null;
  if (S.connect){
    if (S.connect.line && S.connect.line.parentNode) S.connect.line.remove();
    S.connect = null;
  }
  S.curveDrag = null;
}

/* ================================================================== *
 *  Event binding and init
 * ================================================================== */
function bindEvents(){
  document.querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => setTab(b.dataset.tab));
  });

  document.querySelectorAll('#toolbar [data-tool]').forEach(b => {
    b.addEventListener('click', () => {
      S.tool = b.dataset.tool;
      if (S.tool !== 'connect'){
        if (S.connect){
          if (S.connect.line && S.connect.line.parentNode) S.connect.line.remove();
          S.connect = null;
        }
      }
      updateToolbar();
      updateMapHint();
    });
  });

  $('btnDeleteSel').addEventListener('click', deleteSelected);
  $('map').addEventListener('click', onMapClick);

  $('btnImport').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importTemplateFile(f);
  });
  document.addEventListener('dragover', e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')){
      e.preventDefault();
    }
  });
  document.addEventListener('drop', e => {
    if (!e.dataTransfer) return;
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    importTemplateFile(f);
  });

  window.addEventListener('pointermove', onGlobalPointerMove);
  window.addEventListener('pointerup', onGlobalPointerUp);

  $('side').addEventListener('input', onSideInput);
  $('side').addEventListener('change', onSideChange);
  $('side').addEventListener('click', onSideClick);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'Delete' || e.key === 'Backspace'){
      if (S.tab === 'roads' || S.tab === 'cars'){
        e.preventDefault();
        deleteSelected();
      }
    }
    if (e.key === 'Escape'){
      cancelInteractions();
      clearSelection();
    }
  });
}

/* ================================================================== *
 *  Import template / report structure
 * ================================================================== */
function mergeImportedParams(src, nodes, roads){
  const dst = defaultParams();
  if (src && typeof src === 'object'){
    for (const sec of ['road', 'cars', 'simulator', 'run']){
      const from = src[sec];
      if (!from || typeof from !== 'object') continue;
      for (const key of Object.keys(dst[sec])){
        if (Object.prototype.hasOwnProperty.call(from, key)){
          const v = from[key];
          dst[sec][key] = (v && typeof v === 'object')
            ? JSON.parse(JSON.stringify(v)) : v;
        }
      }
    }
  }
  dst.road.num_nodes = nodes.length;
  const maxRoadLanes = roads.reduce((m, r) => Math.max(m, r.lanes || 1), 1);
  const importedMax = Number(dst.road.max_lanes);
  dst.road.max_lanes = Math.max(
    Number.isFinite(importedMax) ? Math.round(importedMax) : 1,
    maxRoadLanes
  );
  if (!Array.isArray(dst.cars.new_car_range) || dst.cars.new_car_range.length !== 2){
    dst.cars.new_car_range = [1, 3];
  }
  if (!Number.isInteger(dst.cars.spawn_interval) || dst.cars.spawn_interval < 1){
    dst.cars.spawn_interval = 1;
  }
  if (!['auto', 'custom', 'uxsim'].includes(dst.run.GIF_ENGINE)){
    dst.run.GIF_ENGINE = 'auto';
  }
  if (!Number.isInteger(dst.run.GIF_TIMESTEP_SKIP) || dst.run.GIF_TIMESTEP_SKIP < 1){
    dst.run.GIF_TIMESTEP_SKIP = 24;
  }
  return dst;
}

function fitImportedPositions(nodes){
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of nodes){
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  }
  const fits = minX >= 0 && maxX <= 100 && minY >= 0 && maxY <= 75;
  if (!fits){
    const w = Math.max(1e-9, maxX - minX);
    const h = Math.max(1e-9, maxY - minY);
    const scale = Math.min(90 / w, 65 / h);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    for (const n of nodes){
      n.x = 50 + (n.x - cx) * scale;
      n.y = 37.5 + (n.y - cy) * scale;
    }
  }
  for (const n of nodes){
    n.x = Math.round(clamp(n.x, 0, 100) * 10000) / 10000;
    n.y = Math.round(clamp(n.y, 0, 75) * 10000) / 10000;
  }
  return !fits;
}

function prepareImportedReport(report){
  if (!report || typeof report !== 'object'){
    throw new Error('不是 JSON 对象');
  }
  const nodesRaw = Array.isArray(report.nodes) ? report.nodes : [];
  const roadsRaw = Array.isArray(report.roads) ? report.roads : [];
  if (!nodesRaw.length) throw new Error('报告没有 nodes，无法导入路网');
  if (!roadsRaw.length) throw new Error('报告没有 roads，无法导入路网');

  const idMap = new Map();
  const nodes = [];
  for (const raw of nodesRaw){
    const oldId = raw && raw.id !== undefined ? raw.id : nodes.length;
    if (idMap.has(oldId)) throw new Error(`节点 id ${oldId} 重复`);
    const pos = Array.isArray(raw && raw.pos) ? raw.pos
      : (raw && raw.tiled_pos ? raw.tiled_pos : [raw && raw.x, raw && raw.y]);
    const x = Number(pos[0]), y = Number(pos[1]);
    if (!Number.isFinite(x) || !Number.isFinite(y)){
      throw new Error(`节点 ${oldId} 缺少有效坐标 pos`);
    }
    nodes.push({oldId, x, y});
    idMap.set(oldId, nodes.length - 1);
  }
  const scaled = fitImportedPositions(nodes);

  const roads = [];
  const pairs = new Set();
  let duplicateRoads = 0;
  for (const raw of roadsRaw){
    const oldA = raw && (raw.ptA !== undefined ? raw.ptA : raw.a);
    const oldB = raw && (raw.ptB !== undefined ? raw.ptB : raw.b);
    if (!idMap.has(oldA) || !idMap.has(oldB)){
      throw new Error(`道路端点 ${oldA} ↔ ${oldB} 在 nodes 中不存在`);
    }
    const a = idMap.get(oldA), b = idMap.get(oldB);
    if (a === b) throw new Error(`不支持自环道路 ${oldA} ↔ ${oldB}`);
    const lanesRaw = Number(raw && raw.lanes);
    const lanes = Number.isInteger(lanesRaw) && lanesRaw >= 1 ? lanesRaw : 1;
    roads.push({id: roads.length, a, b, lanes});
    const key = a < b ? `${a}-${b}` : `${b}-${a}`;
    if (pairs.has(key)) duplicateRoads++;
    pairs.add(key);
  }

  const params = mergeImportedParams(report.params, nodes, roads);
  if (scaled) params.__import_scaled = true;

  return {
    nodes: nodes.map((n, i) => ({id:i, x:n.x, y:n.y})),
    roads,
    params,
    warnings: {
      scaled,
      duplicateRoads
    }
  };
}

function applyImportedReport(candidate){
  S.params = candidate.params;
  delete S.params.__import_scaled;
  S.nodes = candidate.nodes;
  S.roads = candidate.roads;
  S.manualCars = [];
  S.curveSelected = null;
  S.carMode = 'curve';
  const end = Number.isInteger(S.params.run.FRAMES) && S.params.run.FRAMES >= 0
    ? S.params.run.FRAMES : 86400;
  S.curve = [
    {uid: nextUid(), frame: 0, count: 0},
    {uid: nextUid(), frame: end, count: 0}
  ];
  S.selected = null;
  S.tool = 'select';
  S.exportName = `template-${stamp()}.json`;
  setTab('roads');
  updateChrome();
  const notes = [];
  notes.push(`已导入 ${S.nodes.length} 节点 / ${S.roads.length} 道路`);
  notes.push('报告车辆未导入；当前曲线/手工车已清空');
  if (candidate.warnings.scaled) notes.push('坐标已等比缩放到编辑器画布');
  if (candidate.warnings.duplicateRoads) notes.push(`有 ${candidate.warnings.duplicateRoads} 条重复道路`);
  toast(notes.join('；'));
}

function readFileText(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(reader.error || new Error('文件读取失败'));
    reader.readAsText(file);
  });
}

async function importTemplateFile(file){
  if (!file) return;
  toast('正在读取 ' + file.name + '…');
  try {
    const text = await readFileText(file);
    let report;
    try { report = JSON.parse(text); }
    catch (err){ throw new Error('JSON 解析失败：' + err.message); }
    const candidate = prepareImportedReport(report);
    if ((S.nodes.length || S.roads.length) &&
        !confirm('导入会替换当前节点、道路和参数，并清空当前车辆计划。继续？')){
      return;
    }
    applyImportedReport(candidate);
  } catch (err){
    toast('导入失败：' + err.message);
  }
}

function init(){
  S.params = defaultParams();
  S.curve = [
    {uid: nextUid(), frame: 0, count: 0},
    {uid: nextUid(), frame: S.params.run.FRAMES, count: 0}
  ];
  S.exportName = `template-${stamp()}.json`;
  bindEvents();
  setTab('params');
}

/* Public hook for local tests / debugging. */
window.EDITOR = {
  state: S,
  setTab,
  drawMap,
  drawChart,
  buildTemplate,
  validateAll,
  curveValueAt,
  addNodeAt,
  addRoadBetween,
  select,
  reindexEntities
};

init();
</script>
